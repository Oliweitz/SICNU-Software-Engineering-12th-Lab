# ============================================================
# 师范专业 AI 试讲台系统 —— 公共配置（所有环境生效）
# 环境差异配置见 application-dev.yml / application-prod.yml
# 切换环境：--spring.profiles.active=dev|prod 或修改 spring.profiles.active
# ============================================================

spring:
  application:
    name: ai-trial-platform
  profiles:
    # 默认开发环境
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: 8080

# ------------------------------------------------------------
# MyBatis-Plus
# ------------------------------------------------------------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.module.**.entity
  configuration:
    # 数据库下划线字段 ↔ 实体驼峰属性自动映射
    map-underscore-to-camel-case: true
    # SQL 日志（开发环境打印，生产关闭）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      # 逻辑删除字段：1 表示已删除（表中需定义 deleted 列）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ------------------------------------------------------------
# 业务自定义配置（对应 security 模块，迭代 1 使用）
# ------------------------------------------------------------
jwt:
  # ⚠️ 生产环境务必通过环境变量 JWT_SECRET 覆盖，勿提交真实密钥
  secret: ${JWT_SECRET:software-engineering-course-design-secret-key-2026}
  # 登录有效期（小时）
  expire-hours: 24
  # 请求头名称
  header: Authorization
  # 令牌前缀
  token-prefix: "Bearer "

# ------------------------------------------------------------
# 认证与验证码（登录 / 注册 / 找回密码）
# 设计说明见 docs/认证与授权设计.md
# ------------------------------------------------------------
auth:
  captcha:
    # 图形验证码有效期（分钟），一次性使用
    expire-minutes: 5
    # 开发期是否在接口响应里回传验证码明文（生产必须关闭）
    expose-in-response: false
  code:
    # 短信/邮箱验证码有效期（分钟），一次性使用
    expire-minutes: 5
    # 同一目标、同一场景的重发冷却（秒）
    resend-seconds: 60
    # 单个验证码允许的最大校验次数，超过即作废
    max-verify-attempts: 5
    # 开发期是否在接口响应里回传验证码（仅 dev 开启，生产必须关闭）
    expose-in-response: false
    sms:
      # mock = 验证码打印到日志；http = 调用自建短信网关
      provider: ${SMS_PROVIDER:mock}
      http-url: ${SMS_HTTP_URL:}
      http-token: ${SMS_HTTP_TOKEN:}
    mail:
      # mock = 验证码打印到日志；smtp = 走 spring.mail.* 真实发信
      provider: ${MAIL_PROVIDER:mock}
      from: ${MAIL_FROM:no-reply@ai-trial.local}
  login:
    # 连续失败锁定策略（内存计数，重启清零）
    max-failures: 5
    lock-minutes: 15
  cas:
    # mock = 内置模拟统一身份认证；real = 对接学校 CAS Server
    mode: ${CAS_MODE:mock}
    server-url: ${CAS_SERVER_URL:}
    # CAS 回调地址（必须与学校 CAS 登记的一致）
    service-url: ${CAS_SERVICE_URL:http://localhost:8080/api/v1/auth/cas/callback}
    # 登录成功后前端路由
    frontend-callback-url: ${FRONTEND_URL:http://localhost:5173/sso-callback}
  seed:
    # 是否在启动时创建演示账号（仅开发环境开启）
    enabled: false

# ------------------------------------------------------------
# 评测引擎配置（对应 evaluate 模块，迭代 2 使用）
# 实现可插拔：rule = 规则引擎（默认，零依赖可解释）；llm = 大模型增强（需 API Key）
# ------------------------------------------------------------
evaluate:
  impl: rule
  llm:
    base-url: ""
    api-key: ""

# ------------------------------------------------------------
# 文件存储（试讲音视频上传，迭代 4 使用；本地磁盘模拟对象存储）
# ------------------------------------------------------------
storage:
  type: local
  local:
    base-dir: ./uploads

# ------------------------------------------------------------
# Actuator 监控端点（答辩演示 /actuator/health）
# ------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example: debug
